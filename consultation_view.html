<!-- Vue Consultation (Sprint 3) -->
            <div id="view-consultation" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="margin: 0; color: var(--text-main);" id="consultation-patient-name">Dossier Patient</h2>
                        <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;" id="consultation-patient-info">Sélectionnez un patient pour commencer la consultation</p>
                    </div>
                    <button class="btn btn-secondary" id="btn-back-patients">Retour à la liste</button>
                </div>

                <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                    
                    <!-- Historique (Colonne Gauche) -->
                    <div style="flex: 1; min-width: 300px;">
                        <div class="card" style="height: 100%;">
                            <h3 style="margin-top: 0;">Historique Médical</h3>
                            <div id="consultation-historique" style="max-height: 500px; overflow-y: auto; padding-right: 10px;">
                                <!-- Les anciennes consultations s'afficheront ici -->
                                <p class="text-center text-muted">Aucun historique disponible.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Nouvelle Consultation (Colonne Droite) -->
                    <div style="flex: 2; min-width: 350px;">
                        <div class="card">
                            <h3 style="margin-top: 0; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px;">Nouvelle Consultation</h3>
                            
                            <form id="form-nouvelle-consultation">
                                <h4 style="color: var(--primary-color); margin-top: 1.5rem; margin-bottom: 0.5rem;">Constantes Vitales</h4>
                                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                                    <div class="form-group" style="flex: 1; min-width: 120px;">
                                        <label class="form-label">Poids (kg)</label>
                                        <input type="number" step="0.1" id="cons-poids" class="form-control">
                                    </div>
                                    <div class="form-group" style="flex: 1; min-width: 120px;">
                                        <label class="form-label">Taille (cm)</label>
                                        <input type="number" step="1" id="cons-taille" class="form-control">
                                    </div>
                                    <div class="form-group" style="flex: 1; min-width: 120px;">
                                        <label class="form-label">Temp (°C)</label>
                                        <input type="number" step="0.1" id="cons-temp" class="form-control">
                                    </div>
                                    <div class="form-group" style="flex: 1; min-width: 120px;">
                                        <label class="form-label">Tension (mmHg)</label>
                                        <input type="text" id="cons-tension" class="form-control" placeholder="12/8">
                                    </div>
                                </div>

                                <h4 style="color: var(--primary-color); margin-top: 1.5rem; margin-bottom: 0.5rem;">Diagnostic Médico-Légal</h4>
                                <div class="form-group">
                                    <label class="form-label">Symptômes rapportés</label>
                                    <textarea id="cons-symptomes" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Diagnostic *</label>
                                    <textarea id="cons-diagnostic" class="form-control" rows="3" required></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Notes internes</label>
                                    <textarea id="cons-notes" class="form-control" rows="2"></textarea>
                                </div>

                                <h4 style="color: var(--primary-color); margin-top: 1.5rem; margin-bottom: 0.5rem;">Ordonnance / Prescriptions</h4>
                                <div id="prescription-list" style="margin-bottom: 1rem;">
                                    <!-- Liste des médicaments ajoutés -->
                                </div>
                                
                                <div style="background-color: var(--bg-main); padding: 1rem; border-radius: var(--radius-sm); border: 1px dashed rgba(0,0,0,0.1);">
                                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
                                        <input type="text" id="med-nom" class="form-control" placeholder="Médicament" style="flex: 2; min-width: 150px;">
                                        <input type="text" id="med-posologie" class="form-control" placeholder="Posologie (ex: 1 cp matin)" style="flex: 2; min-width: 150px;">
                                        <input type="text" id="med-duree" class="form-control" placeholder="Durée (ex: 7 jours)" style="flex: 1; min-width: 100px;">
                                    </div>
                                    <button type="button" class="btn btn-secondary" id="btn-add-medicament" style="padding: 0.5rem 1rem; font-size: 0.85rem;">+ Ajouter à l'ordonnance</button>
                                </div>

                                <div style="margin-top: 2rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1rem; text-align: right;">
                                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Clôturer la Consultation</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
