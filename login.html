<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Hospira</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('hospira-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>

    <div class="login-container">
        <div class="glass-card">
            <div class="logo-area">
                <h1>Hospi<span>ra</span></h1>
                <p>Système de gestion des consultations</p>
            </div>

            <div id="error-alert" class="error-message">
                Identifiants incorrects. Veuillez réessayer.
            </div>

            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="email" class="form-label">Adresse Email <span class="form-hint">(ex : nom@hopital.com)</span></label>
                    <input type="email" id="email" class="form-control" placeholder="Entrez votre adresse email" required autocomplete="off">
                </div>
                
                <div class="form-group mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe" required autocomplete="off">
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Afficher le mot de passe">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                    Se connecter
                    <span class="loading-spinner"></span>
                </button>
            </form>
            
            <p class="text-center mt-3" style="font-size: 0.85rem; color: var(--text-muted);">
                Êtes-vous un patient ? <a href="#" id="show-register-modal" style="color: var(--primary-color);">Créer un compte</a><br><br>
                &copy; 2026 Hospira.
            </p>
        </div>
    </div>

    <!-- Modal d'inscription Patient -->
    <div id="register-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; padding: 1rem; box-sizing: border-box;">
        <div class="glass-card" style="width: 100%; max-width: 500px; padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto;">
            <button id="close-register-modal" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 style="margin-bottom: 1.5rem; color: var(--primary-color);">Nouveau Patient</h2>
            
            <div id="register-error" class="error-message" style="display: none;"></div>
            <div id="register-success" class="error-message" style="display: none; background-color: rgba(0, 184, 148, 0.1); color: #00b894; border-color: #00b894;"></div>

            <form id="register-form" enctype="multipart/form-data" autocomplete="off">
                
                <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
                    <label for="reg-image" style="cursor: pointer; display: flex; flex-direction: column; align-items: center;">
                        <div id="image-preview" style="width: 80px; height: 80px; border-radius: 50%; background-color: rgba(0, 0, 0, 0.05); border: 2px dashed var(--primary-color); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: 0.3s;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        </div>
                        <span style="font-size: 0.85rem; color: var(--primary-color); margin-top: 0.5rem; font-weight: 500;">Choisir une photo</span>
                    </label>
                    <input type="file" id="reg-image" class="form-control" accept="image/*" style="display: none;">
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Nom *</label>
                        <input type="text" id="reg-nom" class="form-control" required autocomplete="off">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Prénom *</label>
                        <input type="text" id="reg-prenom" class="form-control" required autocomplete="off">
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Date de naissance *</label>
                        <input type="date" id="reg-dob" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Sexe *</label>
                        <select id="reg-sexe" class="form-control" required>
                            <option value="M">Masculin</option>
                            <option value="F">Féminin</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label">Email *</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Mot de passe *</label>
                    <input type="password" id="reg-password" class="form-control" required minlength="6">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Confirmer le mot de passe *</label>
                    <input type="password" id="reg-password-confirm" class="form-control" required minlength="6" autocomplete="off">
                </div>

                <button type="submit" id="btn-register" class="btn btn-primary btn-block">
                    Créer mon compte
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts MVVM / API -->
    <script src="js/api.js"></script>
    <script src="js/viewmodels/loginVM.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
